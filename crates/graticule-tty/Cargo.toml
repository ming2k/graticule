[package]
name = "graticule-tty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Physical TTY host transport: incremental VT parser, input stream, mouse modes, and terminal session lifecycle"
keywords = ["tui", "terminal", "tty", "vt", "input"]
categories = ["command-line-interface"]

[dependencies]
bitflags = { workspace = true }
crossterm = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows", "events", "bracketed-paste"] }

[lints]
workspace = true
