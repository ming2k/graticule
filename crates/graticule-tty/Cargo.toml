[package]
name = "graticule-tty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Pure-native OS TTY host transport: termios/Win32 raw mode, single-reader input loop, capability probing, and terminal session lifecycle"
keywords = ["tui", "terminal", "tty", "termios", "input"]
categories = ["command-line-interface", "os"]

[dependencies]
graticule-vt = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
