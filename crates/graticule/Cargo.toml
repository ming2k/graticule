[package]
name = "graticule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Pure-native retained-mode terminal UI engine: VT wire protocol, damage-tracked cell canvas, Flexbox layout, retained scene graph, and OS TTY transport"
keywords = ["tui", "terminal", "canvas", "vt", "tty"]
categories = ["command-line-interface", "graphics"]

[features]
default = ["tty"]
tty = ["dep:graticule-tty"]

[dependencies]
graticule-vt = { workspace = true }
graticule-canvas = { workspace = true }
graticule-tty = { workspace = true, optional = true }

[lints]
workspace = true
